interface:
  display_name: "Slant4D API/Code Mode"
  short_description: "Script Slant4D operator APIs through Code Mode"
  icon_small: "./assets/logo.svg"
  icon_large: "./assets/logo-large.png"
  brand_color: "#FD00FC"
  default_prompt: "Use $slant4d-codemode to resolve market insert evidence against Slant4D catalog, source-part readiness, and lifecycle proof state through Cloudflare Code Mode or the operator JSON API."
dependencies:
  tools:
    - type: "mcp"
      value: "slant4d-codemode"
      description: "Slant4D Cloudflare Code Mode search/execute portal"
      transport: "stdio"
      command: "npx"
      args:
        - "-y"
        - "mcp-remote@latest"
        - "https://agents-portal.slant4d.com/mcp?codemode=search_and_execute"
