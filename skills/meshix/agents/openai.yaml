interface:
  display_name: "Meshix"
  short_description: "Create and review 3D CAD in Meshix"
  icon_small: "./assets/logo.svg"
  icon_large: "./assets/logo-large.png"
  default_prompt: "Use $meshix to find, generate, or review a Meshix CAD design."
dependencies:
  tools:
    - type: "mcp"
      value: "meshix"
      description: "Meshix CAD generation MCP server"
      transport: "streamable_http"
      url: "https://meshix.app/mcp"
policy:
  allow_implicit_invocation: true
