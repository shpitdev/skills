interface:
  display_name: "dspy-decide"
  short_description: "Optimize labeled decision-model requests"
  default_prompt: "Use $dspy-decide to optimize my decision request and integrate decide()."
dependencies:
  tools:
    - type: "mcp"
      value: "dspy_decide"
      description: "Public decision optimization tools"
      transport: "streamable_http"
      url: "https://dspy-decide.vercel.app/mcp"
policy:
  allow_implicit_invocation: true
